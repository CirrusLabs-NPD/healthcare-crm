# === e2e profile ===================================================
# Boots the packaged jar for the Playwright browser suite against an in-memory
# H2 database in MySQL-compatibility mode — the same datasource the S-6 unit
# tests run green on. No external services and no secrets, so the jar starts
# with no .env present (HealthcarecrmApplication calls dotenv.ignoreIfMissing()).
#
# Activated only by --spring.profiles.active=e2e, which Playwright's webServer
# passes. The H2 driver is not on the production runtime classpath (it is
# test-scoped in pom.xml, promoted to runtime only by the `e2e` Maven profile),
# so this profile can never be selected in a prod artifact.
# ===================================================================

spring.datasource.url=jdbc:h2:mem:healthcarecrm_e2e;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Never run the one-off due-date backfill under e2e.
scheduling.migrate-due-dates=false
