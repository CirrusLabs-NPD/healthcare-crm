spring.application.name=healthcarecrm

# Tests run against an in-memory H2 database in MySQL-compatibility mode so the
# full Spring context loads in CI without a real MySQL server. Schema is created
# from the JPA entities (create-drop) and torn down at the end of the run.
spring.datasource.url=jdbc:h2:mem:healthcarecrm;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Keep the one-off due-date backfill off during tests.
scheduling.migrate-due-dates=false
