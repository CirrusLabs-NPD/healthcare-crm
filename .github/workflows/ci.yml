name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build, compile and run tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      # --- Browser e2e (S-9) -------------------------------------------------
      # The verify step above ran the JUnit suite (incl. the AC-2/13/20 backend
      # gap tests). Now package the app with the `e2e` Maven profile — which
      # promotes the H2 driver to runtime scope so `java -jar` can boot on the
      # `e2e` Spring profile — and let Playwright's webServer start that jar and
      # drive the calendar in a real Chromium.

      - name: Package the e2e jar
        # clean first: `verify` above already produced target/*.jar with H2
        # test-scoped (absent from the fat jar). Re-running `package` without
        # clean leaves that jar in place, so `java -jar` boots the e2e profile
        # and fails with "Cannot load driver class: org.h2.Driver". Cleaning
        # forces the fat jar to be rebuilt with the `e2e` profile's runtime-
        # scoped H2 embedded.
        run: ./mvnw -B -Pe2e -DskipTests clean package

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/e2e/package-lock.json

      - name: Install e2e dependencies
        working-directory: backend/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: backend/e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e
        working-directory: backend/e2e
        env:
          CI: 'true'
        run: npm test

      # Keep the evidence on a red run: the HTML report (with embedded traces)
      # and the raw test-results/ (traces, videos, screenshots) Playwright is
      # configured to retain on failure. Nothing is uploaded on a green run.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: backend/e2e/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: backend/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore
